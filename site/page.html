<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{title}}</title>
    <meta name="description" content="{{description}}" />

    <!-- What a link to this page looks like when it is pasted into a staff room chat or a
         message to a colleague, which is how a teacher hears about a tool like this. Left
         out, the link shows as a bare address and says nothing. -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="{{title}}" />
    <meta property="og:description" content="{{description}}" />
    <meta property="og:image" content="{{shareImage}}" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="stylesheet" href="./page.css" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
  </head>
  <body>
    <a class="skip" href="#content">Skip to the page</a>
    <header>
      {{wordmark}}
      <nav aria-label="Sections">
        {{nav}}
      </nav>
      {{actions}}
    </header>
    <main id="content">
      <h1>{{title}}</h1>
      {{content}}
    </main>
    <footer>
      <nav aria-label="Policies">
        {{footer}}
      </nav>
      <p>{{colophon}}</p>
    </footer>
  </body>
</html>
