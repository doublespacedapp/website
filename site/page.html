<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{title}}</title>
    <meta name="description" content="{{description}}" />

    <!-- What a link to this page looks like when it is pasted into a staff room chat or a
         message to a colleague, which is how a teacher hears about a tool like this. Left
         out, the link shows as a bare address and says nothing. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="{{siteName}}" />
    <meta property="og:title" content="{{title}}" />
    <meta property="og:description" content="{{description}}" />
    <meta property="og:image" content="{{shareImage}}" />
    <!-- Stated, because a service that unfurls a link lays out the card before it has
         fetched the picture, and one that does not know the shape leaves a gap of the
         wrong size or crops to its own. -->
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="{{shareImageAlt}}" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- The colour a phone paints its own chrome around the page. The page's raised
         surface rather than the product's blue: this is the frame around the writing, and
         a blue bar above a white page of documentation reads as a different site. -->
    <meta name="theme-color" content="#f4f4f4" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#212327" media="(prefers-color-scheme: dark)" />

    <link rel="stylesheet" href="./page.css" />
    <!-- Two icons, and the company's is not the product's: each root is given its own by
         the build. The dark one is a courtesy -- Safari and Firefox honour the media query
         on an icon link, Chrome ignores it, so it is the better picture where it is read
         and no worse where it is not. -->
    <link
      rel="icon"
      href="./icon-dark.svg"
      type="image/svg+xml"
      media="(prefers-color-scheme: dark)"
    />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <!-- For anything that will not take the SVG, and for a home screen. Without the touch
         icon, iOS saves the page under a screenshot of itself. -->
    <link rel="icon" href="./favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
  </head>
  <body>
    <a class="skip" href="#content">Skip to the page</a>
    <header>
      {{wordmark}}
      <nav aria-label="Sections">
        {{nav}}
      </nav>
      {{actions}}
    </header>
    <main id="content">
      <h1>{{title}}</h1>
      {{content}}
    </main>
    <footer>
      <nav aria-label="Policies">
        {{footer}}
      </nav>
      <p>{{colophon}}</p>
    </footer>
  </body>
</html>
